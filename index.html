<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self';">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Ledgerble</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    :root {
      --rd-sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", system-ui, sans-serif;
      --rd-mono: ui-monospace, "SF Mono", "SFMono-Regular", Menlo, "Cascadia Code", monospace;
    }
    body {
      font-family: var(--rd-sans);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      height: 100vh; overflow: hidden;
      background:
        radial-gradient(120% 90% at 50% -10%, #EFF1F5 0%, rgba(239,241,245,0) 55%),
        linear-gradient(180deg, #E7EAEF 0%, #DCE0E7 100%);
    }
    #root { width: 100vw; height: 100vh; }

    /* hover states (calm) */
    .rd-row:hover { background: #F7F8FA; }
    .rd-nav:hover { background: #E7E9ED; }
    .rd-acct:hover { background: #F2F3F6; }
    .rd-menu:hover { background: rgba(16,18,22,0.07); }

    /* focus ring */
    input:focus, select:focus {
      border-color: #2E6E5D !important;
      box-shadow: 0 0 0 3px rgba(46,110,93,0.18);
    }
    input::placeholder { color: #AFB3BB; }

    /* slim scrollbars */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #D2D6DD; border-radius: 4px; border: 2px solid transparent; background-clip: content-box; }
    ::-webkit-scrollbar-thumb:hover { background: #B9BEC7; background-clip: content-box; }

    button { font-family: inherit; }

    /* ── print: drop all chrome, let the active report flow onto paper ── */
    @media print {
      @page { margin: 14mm; }
      html, body { height: auto !important; overflow: visible !important; background: #fff !important; }
      body { display: block !important; }
      .app-root { height: auto !important; display: block !important; }
      .app-stage { padding: 0 !important; display: block !important; height: auto !important; overflow: visible !important; }
      .print-card { box-shadow: none !important; border: none !important; border-radius: 0 !important; max-height: none !important; height: auto !important; width: 100% !important; }
      .card-body, .main-pane, .pane-region, .pane-content { height: auto !important; overflow: visible !important; display: block !important; }
      .pane-content * { height: auto !important; max-height: none !important; overflow: visible !important; }
      .chrome-print-hide, [data-omelette-chrome] { display: none !important; }
      #printHeader { display: block !important; }
      table, .rd-row { break-inside: avoid; }
      ::-webkit-scrollbar { display: none; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="dist/bundle.js"></script>
</body>
</html>
