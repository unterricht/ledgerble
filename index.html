<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self';">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Ledgerble</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    :root {
      --rd-sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", system-ui, sans-serif;
      --rd-mono: ui-monospace, "SF Mono", "SFMono-Regular", Menlo, "Cascadia Code", monospace;
    }
    body {
      font-family: var(--rd-sans);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      height: 100vh; overflow: hidden;
      background: #ffffff;
    }
    #root { width: 100vw; height: 100vh; }

    /* hover states (calm) */
    .rd-row:hover { background: #F7F8FA; }
    .rd-nav:hover { background: #E7E9ED; }
    .rd-acct:hover { background: #F2F3F6; }
    .rd-menu:hover { background: rgba(16,18,22,0.07); }

    /* focus ring */
    input:focus, select:focus {
      border-color: #2E6E5D !important;
      box-shadow: 0 0 0 3px rgba(46,110,93,0.18);
    }
    input::placeholder { color: #AFB3BB; }

    /* dual-thumb date-range slider: transparent native tracks overlaid on the
       custom pine track; only the thumbs catch pointer events so both are draggable */
    .rd-daterange input[type=range] { pointer-events: none; outline: none; }
    .rd-daterange input[type=range]::-webkit-slider-runnable-track { background: transparent; height: 18px; }
    .rd-daterange input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none; pointer-events: auto; cursor: grab;
      width: 15px; height: 15px; margin-top: 2px; border-radius: 50%;
      background: #FFFFFF; border: 1.5px solid #2E6E5D; box-shadow: 0 1px 3px rgba(16,18,22,0.18);
    }
    .rd-daterange input[type=range]:disabled::-webkit-slider-thumb { border-color: #AFB3BB; cursor: default; }
    .rd-daterange input[type=range]:focus { box-shadow: none; }

    /* slim scrollbars */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #D2D6DD; border-radius: 4px; border: 2px solid transparent; background-clip: content-box; }
    ::-webkit-scrollbar-thumb:hover { background: #B9BEC7; background-clip: content-box; }

    button { font-family: inherit; }

    /* print-only elements are hidden on screen */
    .print-logo { display: none; }

    /* ── print: turn the active report tab into a clean A4 / US-Letter document ──
       (drop-in from Entwicklung/print/ledgerble-print.css, "Quiet Ledger" tokens) */
    @media print {
      /* size:auto lets the driver pick A4 or Letter; 13mm clears both safely */
      @page { size: auto; margin: 13mm; }

      /* honour colours on colour printers; greys/parentheses carry meaning on mono */
      * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }

      html, body { height: auto !important; overflow: visible !important; background: #fff !important; }
      body { display: block !important; }

      /* collapse the app chrome, let the report flow onto paper */
      .app-root { height: auto !important; display: block !important; }
      .print-card { box-shadow: none !important; border: none !important; border-radius: 0 !important; max-height: none !important; height: auto !important; width: 100% !important; }
      .card-body, .main-pane, .pane-region, .pane-content { height: auto !important; overflow: visible !important; display: block !important; }
      /* flatten scroll regions WITHOUT touching fixed heights — forcing height:auto here
         collapsed the chart canvas and the breakdown bars (height:13px) to nothing. */
      .pane-content * { max-height: none !important; overflow: visible !important; }
      .pane-content > * { height: auto !important; }

      /* window chrome, sidebar, pane header, inspector, search, toolbars … gone */
      .chrome-print-hide, [data-omelette-chrome] { display: none !important; }
      ::-webkit-scrollbar { display: none; }

      /* letterhead — the print-only #printHeader the Shell renders, with gerbil mark */
      #printHeader {
        display: block !important;
        padding: 0 0 10px !important;
        margin: 0 0 16px !important;
        border-bottom: 1.5px solid #1E2026 !important;
      }
      .print-logo { display: inline-block; width: 18px; height: 18px; }
      #printHeader .print-title { font-size: 22px !important; letter-spacing: -0.025em; }
      #printHeader .print-sub   { font-size: 11px !important; color: #888D96 !important; }

      /* compact, financial-report table density. table-layout:fixed pins the table to
         the page width and splits it into columns, so a right-aligned amount in the last
         column can never spill past the right margin (which clipped the € + cents). */
      .pane-content table { width: 100% !important; border-collapse: collapse !important; table-layout: fixed !important; }
      /* repeat the column headers at the top of EVERY printed page … */
      .pane-content thead { display: table-header-group !important; }
      .pane-content tfoot { display: table-footer-group !important; }
      /* … but sticky positioning fights pagination — force it static for print */
      .pane-content thead th {
        position: static !important;
        background: #fff !important;
        padding: 7px 6px !important;
        font-size: 8.5pt !important;
        border-bottom: 1.2px solid #D8DBE1 !important;
      }
      .pane-content tbody td {
        padding: 4.5px 6px !important;
        font-size: 9pt !important;
        border-bottom: 1px solid #E6E8EC !important;
        overflow: hidden !important;
        text-overflow: ellipsis !important;
      }
      /* never split a single row / chart / breakdown bar across pages — but DO let a
         long table itself flow across pages (otherwise page 1 shows only the heading). */
      tr, .rd-row, svg, canvas { break-inside: avoid; page-break-inside: avoid; }
      thead { break-after: avoid; }
      /* zebra helps scan dense tables on paper */
      .pane-content tbody tr:nth-child(even) td { background: #FBFBFC !important; }
      /* section headings are ordinary tbody rows, so they land in the zebra count
         and can be shaded like data — and may be orphaned at the foot of a page */
      .pane-content tbody tr.rd-section-head td { background: transparent !important; }
      .rd-section-head { break-after: avoid; page-break-after: avoid; }

      .pane-content [class] { box-shadow: none !important; }

      /* big overview stat values: keep on one line and shrink so a long amount like
         "1.234.567 CHF" never overflows its narrow print column. */
      .rd-stat-val { font-size: 13pt !important; letter-spacing: -0.03em !important; white-space: nowrap !important; }

      /* Postings table: hand-tuned column widths (table-layout:fixed splits to these).
         Date + type are slim, the amount only needs ~18%, so the account gets the room. */
      .rd-postings thead th:nth-child(1), .rd-postings tbody td:nth-child(1) { width: 15% !important; }
      .rd-postings thead th:nth-child(2), .rd-postings tbody td:nth-child(2) { width: 20% !important; }
      .rd-postings thead th:nth-child(3), .rd-postings tbody td:nth-child(3) { width: 36% !important; }
      .rd-postings thead th:nth-child(4), .rd-postings tbody td:nth-child(4) { width: 18% !important; }
      .rd-postings thead th:nth-child(5), .rd-postings tbody td:nth-child(5) { width: 11% !important; }
      /* date + amount are fixed-format values — never break them at a hyphen or before € */
      .rd-postings tbody td:nth-child(1), .rd-postings tbody td:nth-child(4) { white-space: nowrap !important; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="dist/bundle.js"></script>
</body>
</html>
